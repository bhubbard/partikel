[package]
name = "partikel"
version = "0.1.0"
edition = "2021"
authors = ["Brandon Hubbard"]
description = "Irreducible, sub-millisecond micro-agents & deterministic Tier 0 edge engine for Apple Silicon"
license = "MIT"
repository = "https://github.com/bhubbard/partikel"
readme = "README.md"
keywords = ["micro-agents", "apple-silicon", "mcp", "slm", "metal"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "3.1"
regex = "1.11"
tokio = { version = "1.43", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
schemars = "0.8"

[[bin]]
name = "partikel"
path = "src/main.rs"

[[bin]]
name = "ptk"
path = "src/bin/ptk.rs"

[lib]
name = "partikel"
path = "src/lib.rs"
